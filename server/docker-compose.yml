# SSHDesk Server + PostgreSQL.
#   cp .env.example .env   (edit SECRET_KEY, POSTGRES_PASSWORD, SMTP_*)
#   docker compose up -d
# Put it behind HTTPS (Caddy/Nginx/Traefik) before using it over the internet.
services:
  server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sshdesk:${POSTGRES_PASSWORD}@db:5432/sshdesk
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - server-data:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sshdesk
      POSTGRES_USER: sshdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sshdesk"]
      interval: 5s
      retries: 10

volumes:
  server-data:
  db-data:
