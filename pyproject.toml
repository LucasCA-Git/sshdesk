[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sshdesk"
version = "1.1.0"
description = "SSH connection manager and terminal for Windows and Linux, driven by your ~/.ssh/config"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Lucas Cardoso Alecrim" }]
maintainers = [{ name = "Lucas Cardoso Alecrim" }]
keywords = ["ssh", "terminal", "ssh-config", "pyside6", "paramiko", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "paramiko>=3.4",
    "cryptography>=42",
    "pyte>=0.8.2",
    "keyring>=24",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/LucasCA-Git/sshdesk"
Documentation = "https://github.com/LucasCA-Git/sshdesk/blob/main/docs/COMO_FUNCIONA.md"
Changelog = "https://github.com/LucasCA-Git/sshdesk/blob/main/CHANGELOG.md"
Issues = "https://github.com/LucasCA-Git/sshdesk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.6"]

[project.scripts]
sshdesk = "ssh_terminal.main:main"
ssh-terminal = "ssh_terminal.main:main"

[project.gui-scripts]
sshdesk-gui = "ssh_terminal.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssh_terminal = ["resources/icons/*", "resources/styles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B008", "B023", "B905", "E501"]
