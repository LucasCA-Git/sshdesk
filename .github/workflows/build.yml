name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, artifact: VeyLix-Windows }
          - { name: Linux, os: ubuntu-22.04, artifact: VeyLix-Linux }
          - { name: macOS (Apple Silicon), os: macos-latest, artifact: VeyLix-macOS-arm64 }
          - { name: macOS (Intel), os: macos-15-intel, artifact: VeyLix-macOS-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build executable
        run: pyinstaller --noconfirm --clean veylix.spec
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/ssh_terminal/__init__.py').read()).group(1))")
          ARCH=$(uname -m)
          STAGE=$(mktemp -d)
          cp -R dist/VeyLix.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "VeyLix $VERSION" -srcfolder "$STAGE" -ov -format UDZO "dist/VeyLix-$VERSION-macos-$ARCH.dmg"
          # keep only the .dmg in the artifact (the .app is inside it)
          rm -rf dist/VeyLix dist/VeyLix.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
